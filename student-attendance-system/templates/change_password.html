{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<section class="card auth-card">
  <h1>Change password</h1>
  <p class="muted">Signed in as <strong>{{ g.admin }}</strong>.</p>

  {% if errors %}
    <div class="form-errors" role="alert"><ul>{% for e in errors %}<li>{{ e }}</li>{% endfor %}</ul></div>
  {% endif %}

  <form method="post" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="field"><span>Current password</span>
      <input type="password" name="current_password" autocomplete="current-password" required autofocus></label>
    <label class="field"><span>New password</span>
      <input type="password" id="new_password" name="new_password" autocomplete="new-password" minlength="8" maxlength="128" required>
      <small>At least 8 characters with a letter and a number.</small></label>
    <label class="field"><span>Confirm new password</span>
      <input type="password" name="confirm_password" autocomplete="new-password" required></label>
    <div class="form-actions">
      <button class="btn btn-primary" type="submit">Change password</button>
      <a class="btn" href="{{ url_for('dashboard') }}">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
