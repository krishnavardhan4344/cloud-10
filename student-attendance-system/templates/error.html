{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<section class="card error-page">
  <p class="error-code">{{ status }}</p>
  <h1>{{ title }}</h1>
  <p class="muted">{{ message }}</p>
  <p>
    {% if g.admin %}<a class="btn btn-primary" href="{{ url_for('dashboard') }}">Back to dashboard</a>
    {% else %}<a class="btn btn-primary" href="{{ url_for('login') }}">Go to login</a>{% endif %}
  </p>
</section>
{% endblock %}
